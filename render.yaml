# HAFISCO Inventory — Render Blueprint
# Dashboard: New → Blueprint → connect maryam224422/hafisco-inventory (or mariamahmed224 fork upstream)
# Docs: https://render.com/docs/infrastructure-as-code

databases:
  - name: hafisco-db
    databaseName: hafisco_inventory
    user: hafisco
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: hafisco-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    # Runs once after the first successful deploy
    initialDeployHook: node scripts/init-db.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hafisco-db
          property: connectionString
      # Internal Render DB usually does not need SSL
      - key: DB_SSL
        value: "false"
      # Used for GET /api/setup/init-db?key=... when Shell is unavailable
      - key: SETUP_SECRET
        generateValue: true
